datasets:
  dataset_name: 'visa'  # choice ['mvtec_ad', 'mvtec_loco', 'visa', 'btad', 'mpdd', 'miniled_ad', 'microled_ad']
  data_path: C:\Users\Administrator\Desktop\dataset\visa # e.g. ./data/mvtec_anomaly_detection/ or C:\Users\Administrator\Desktop\dataset\MVTec_loco
  class_name:  'all' # 'ALL' 'transistor' 'breakfast_box' 'bracket_black' 'miniled_TypeA_1' 'microled_TypeA_1'
  img_resize: 518  # 512 is for Patch 16 (32*16), for Patch 14 use 518 (37*14)
  divide_num: 1
models:
  backbone_name: 'ViT-L-14-336'
  pretrained: 'openai'
  batch_size: 4
  feature_layers: [2, 5, 8, 11]
  r_list: [1, 3, 5]
msm:
  module: 'original'  # choice ['original', 'optimized']; optimized uses models/modules/MSM2.0.py
  
device: 0
testing:
  output_dir: 'output'

  desktop_results_dir: C:\Users\Administrator\Desktop\公共数据集\visa\gammm=1.5
  desktop_results_filename: 'results.xlsx' # 修改这里控制复制到桌面的MuSc结果表文件名
  module_profile_filename: 'musc_module_profile.xlsx' # 修改这里控制复制到桌面的模块分析表文件名
  
  vis: True
  vis_type: single_norm # choice ['single_norm', 'whole_norm']
  save_excel: True
  vis_tsne: False
  tsne_perplexity: 30
  tsne_n_iter: 1000
  tsne_source: 'lnamd' # 'class' or 'lnamd'


# models['backbone_name'] choice:
# ViT-B-32 | ViT-B-16 | ViT-B-16-plus-240
# ViT-L-14 | ViT-L-14-336
# dino_vitbase8 | dino_vitbase16
# dinov2_vitb14 | dinov2_vitl14 |dinov2_vits14
# dinov3_vitl16

# models['pretrained'] choice:
# openai (apply to ViT-B-32, ViT-B-16, ViT-L-14 and ViT-L-14-336)
# laion400m_e31 (apply to ViT-B-32, ViT-B-16, ViT-B-16-plus-240 and ViT-L-14)
# laion400m_e32 (apply to ViT-B-32, ViT-B-16, ViT-B-16-plus-240 and ViT-L-14)
